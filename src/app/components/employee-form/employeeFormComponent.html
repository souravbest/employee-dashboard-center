<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
<div>
<label>Name</label>
<input formControlName="name" />
<div *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
<small *ngIf="form.get('name')?.errors?.['required']">Name is required.</small>
<small *ngIf="form.get('name')?.errors?.['minlength']">Name must be at least 3 characters.</small>
</div>
</div>


<div>
<label>Email</label>
<input formControlName="email" />
<div *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
<small *ngIf="form.get('email')?.errors?.['required']">Email is required.</small>
<small *ngIf="form.get('email')?.errors?.['email']">Please enter a valid email.</small>
</div>
</div>


<div>
<label>Department</label>
<select formControlName="department">
<option *ngFor="let d of departments" [value]="d">{{d}}</option>
</select>
<div *ngIf="form.get('department')?.touched && form.get('department')?.invalid">
<small>Department is required.</small>
</div>
</div>


<div>
<label>Date of Joining</label>
<input type="date" formControlName="dateOfJoining" />
<div *ngIf="form.get('dateOfJoining')?.touched && form.get('dateOfJoining')?.invalid">
<small *ngIf="form.get('dateOfJoining')?.errors?.['required']">Date of Joining is required.</small>
<small *ngIf="form.get('dateOfJoining')?.errors?.['futureDate']">Date cannot be in the future.</small>
</div>
</div>


<div>
<button type="submit">Save</button>
<button type="button" (click)="cancel.emit()">Cancel</button>
</div>
</form>
